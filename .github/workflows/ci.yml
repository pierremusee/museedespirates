name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un nouveau push sur la même ref annule le run devenu obsolète.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # borne anti-hang (run observé ~1 min)
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: musee_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/musee_db
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrate + seed
        run: |
          alembic upgrade head
          python scripts/seed_db.py

      # Base dédiée aux tests pytest : les fixtures y écrivent puis
      # rollbackent — jamais de fuite vers musee_db.
      - name: Create + migrate test DB (musee_test)
        run: |
          psql postgresql://postgres:password@localhost:5432/postgres -c "CREATE DATABASE musee_test"
          alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/musee_test

      # Dérive modèles ↔ migrations : échoue si le schéma réel diffère de
      # ce que les modèles déclarent.
      - name: Alembic check (migration drift)
        run: alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/musee_test

      # Suite métier pytest (règles de validation, flux réservation,
      # tarification) + coverage avec plancher anti-régression (65 %).
      - name: Pytest + coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/musee_test

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml
          if-no-files-found: ignore

      - name: Start API
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && exit 0
            sleep 1
          done
          echo "API did not start" && exit 1

      - name: E2E booking suite
        run: python scripts/test_booking.py

      - name: Concurrency suite (M1)
        run: python scripts/test_concurrency.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # borne anti-hang (run observé ~1 min)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      # Vitest + coverage v8 (plancher 80 % sur la logique front testable :
      # app/**/*.ts + lib/**/*.ts — voir vitest.config.ts).
      - name: Unit tests + coverage (vitest)
        run: npm test -- --coverage

      # Les types de routes (LayoutProps, PageProps…) sont générés dans
      # .next/types — absents sans build : next typegen les produit.
      - name: Typecheck
        run: |
          npx next typegen
          npx tsc --noEmit

      # tsc vérifie les types, pas le build (frontière Server/Client,
      # bundling). Les pages qui fetch sont dynamiques (no-store) :
      # aucun appel API au build. NEXT_PUBLIC_* est inlinée au build
      # dans les composants clients — posée explicitement pour être
      # déterministe.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
