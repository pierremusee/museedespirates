services:
  postgres:
    image: postgres:15-alpine
    container_name: musee_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: musee_db
    ports:
      - "5432:5432"
    volumes:
      - musee_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musee_db"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  musee_pgdata:
